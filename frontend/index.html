    <link rel="icon" type="image/x-icon"   href="/favicon.ico" sizes="any"/>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon"           href="/logo192.png" />
    <link rel="manifest"                   href="/site.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EventSphere — Smart ticketing with real QR tickets, interactive seat grids, Claude AI suggestions, and instant email delivery. India's elite event management platform." />
    <meta name="theme-color" content="#00F2FE" />
    <meta name="color-scheme" content="dark light" />

    <meta property="og:title"       content="EventSphere — Elite Event Management Platform" />
    <meta property="og:description" content="Real QR tickets, interactive seat grids, AI-powered suggestions and instant email delivery." />
    <meta property="og:type"        content="website" />
    <meta property="og:image"       content="/logo512.png" />
    <meta name="twitter:card"       content="summary" />

    <title>EventSphere — Elite Event Management Platform</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts & icons loaded non-blocking: render starts immediately with
         a fallback font, then swaps in once these finish loading. This is
         what Lighthouse's "Render-blocking requests" flag was pointing at —
         a plain <link rel="stylesheet"> blocks first paint until it loads. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <!-- Bootstrap Icons self-hosted (not loaded from jsdelivr CDN) so we
         can set font-display:swap ourselves — the CDN's own file used
         font-display:block, which Lighthouse flagged as a ~200ms render
         delay. Self-hosting also means it loads from the same origin as
         the page, with no extra DNS lookup to jsdelivr.net. -->
    <link rel="stylesheet" href="/fonts/bootstrap-icons.css" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" />
    </noscript>
    <!-- Razorpay's checkout.js is now loaded on-demand only on pages that
         actually need it (see EventDetail.jsx), instead of every page load —
         most visits (homepage, browsing events) never touch payment at all. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
