<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00F2FE"/>
      <stop offset="1" stop-color="#9B51E0"/>
    </linearGradient>
  </defs>
  <!-- Gradient background -->
  <rect width="100" height="100" rx="20" fill="url(#g)"/>
  <!-- Calendar body -->
  <rect x="20" y="25" width="60" height="55" rx="8" fill="none" stroke="black" stroke-width="7"/>
  <!-- Header line -->
  <line x1="20" y1="42" x2="80" y2="42" stroke="black" stroke-width="7"/>
  <!-- Left pin -->
  <line x1="35" y1="15" x2="35" y2="32" stroke="black" stroke-width="7" stroke-linecap="round"/>
  <!-- Right pin -->
  <line x1="65" y1="15" x2="65" y2="32" stroke="black" stroke-width="7" stroke-linecap="round"/>
</svg>
